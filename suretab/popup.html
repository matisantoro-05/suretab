<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="popup-head">
    <img src="icons/icon32.png" width="20" height="20" alt="">
    <strong>SureTab</strong>
  </header>
  <button class="btn primary block" id="save-window" data-i18n="saveWindow"></button>
  <button class="btn block" id="save-all" data-i18n="saveAll"></button>
  <button class="btn block" id="save-tab" data-i18n="saveTab"></button>
  <hr>
  <button class="btn ghost block" id="open" data-i18n="openList"></button>
  <p class="muted small" id="total"></p>
  <p class="status small" id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
